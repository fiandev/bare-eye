name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: bare-eye
  COPR_PROJECT: bare-eye
  # Chroots the COPR project is created with (only used when it does not exist).
  COPR_CHROOTS: >-
    fedora-43-x86_64
    fedora-43-aarch64
    fedora-44-x86_64
    fedora-44-aarch64
    fedora-45-x86_64
    fedora-45-aarch64
    fedora-rawhide-x86_64

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "6"
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: loong64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: netbsd
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve arch name
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          case "${GOARCH}" in
            amd64) arch="x86_64" ;;
            386)   arch="i386" ;;
            arm)   arch="armv${GOARM}" ;;
            arm64) arch="aarch64" ;;
            *)     arch="${GOARCH}" ;;
          esac
          echo "ARCH=${arch}" >> "${GITHUB_ENV}"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::12}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="${BINARY}_${version}_${GOOS}_${ARCH}"
          mkdir -p "dist/${name}"

          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/fiandev/bare-eye/internal/version.Version=${version} \
              -X github.com/fiandev/bare-eye/internal/version.Commit=${commit} \
              -X github.com/fiandev/bare-eye/internal/version.Date=${date}" \
            -o "dist/${name}/${BINARY}" ./cmd/bare-eye

          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}_${{ matrix.goos }}_${{ env.ARCH }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ env.BINARY }}_*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum "${BINARY}"_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/SHA256SUMS)

          # Safe to re-run: a previous run may have already published the
          # release (or created it as a draft), so refresh assets instead of
          # failing on "release already exists".
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating assets"
            gh release upload "${TAG}" "${assets[@]}" --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --verify-tag \
              --generate-notes ||
              gh release upload "${TAG}" "${assets[@]}" --repo "${REPO}" --clobber
          fi

  copr:
    name: Publish to COPR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install rpmbuild and copr-cli
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          pipx install copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The COPR_CONFIG secret holds the whole config file, e.g.
      #   [copr-cli]
      #   username = alfiansa
      #   login = alfiansa
      #   token = <api token>
      #   copr_url = https://copr.fedorainfracloud.org
      - name: Configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_CONFIG}" ]; then
            echo "::error::secret COPR_CONFIG is not set"
            exit 1
          fi
          mkdir -p "$HOME/.config"
          printf '%s\n' "${COPR_CONFIG}" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      # The workflow used to assume the COPR project already existed, which
      # failed with "Project <owner>/bare-eye does not exist" on the first tag.
      - name: Ensure COPR project exists
        run: |
          set -euo pipefail
          if copr-cli get "${COPR_PROJECT}" >/dev/null 2>&1; then
            echo "COPR project ${COPR_PROJECT} already exists"
            exit 0
          fi

          chroot_args=()
          for chroot in ${COPR_CHROOTS}; do
            chroot_args+=(--chroot "${chroot}")
          done

          echo "Creating COPR project ${COPR_PROJECT}"
          copr-cli create "${COPR_PROJECT}" "${chroot_args[@]}" \
            --description "Terminal dashboard for monitoring Linux servers over SSH"

      # A newly created project (and sometimes an existing one) has no DNF repo
      # metadata yet. Without `repodata/repomd.xml` the COPR build job waits for
      # the `copr_base` repository for ~10 minutes and then fails, so regenerate
      # the repos unconditionally before submitting anything.
      - name: Regenerate COPR repo metadata
        run: |
          set -euo pipefail
          if ! output="$(copr-cli regenerate-repos "${COPR_PROJECT}" 2>&1)"; then
            # Non-zero here usually just means a regeneration is already queued
            # for the project; the wait step below still validates the outcome.
            echo "::warning::copr-cli regenerate-repos exited non-zero; assuming a regeneration is already running"
            printf '%s\n' "${output}"
          else
            printf '%s\n' "${output}"
          fi

      # copr-cli has no `get-json` subcommand, so read the project from the
      # public API v3. Only chroots the project actually has can be polled;
      # entries in COPR_CHROOTS that are not enabled are skipped with a warning
      # (enabling them is a separate change).
      - name: Wait for COPR repo metadata
        run: |
          set -euo pipefail

          owner="$(awk -F= '/^[[:space:]]*username[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' "$HOME/.config/copr")"
          if [ -z "${owner}" ]; then
            echo "::error::could not read username from $HOME/.config/copr"
            exit 1
          fi

          api_url="https://copr.fedorainfracloud.org/api_3/project?ownername=${owner}&projectname=${COPR_PROJECT}"
          echo "Querying COPR API: ${api_url}"
          if ! project_json="$(curl -fsS --retry 3 --retry-delay 2 "${api_url}")"; then
            echo "::error::failed to query COPR API: ${api_url}"
            exit 1
          fi

          if ! chroot_map="$(printf '%s' "${project_json}" | python3 -c 'import json, sys; repos = json.load(sys.stdin).get("chroot_repos") or {}; [print(f"{k}\t{v}") for k, v in sorted(repos.items())]')"; then
            echo "::error::failed to parse chroot_repos from COPR API response"
            exit 1
          fi
          if [ -z "${chroot_map}" ]; then
            echo "::error::COPR project ${COPR_PROJECT} reports no enabled chroots"
            exit 1
          fi

          enabled_chroots=()
          declare -A repo_urls=()
          while IFS=$'\t' read -r chroot repo_url; do
            enabled_chroots+=("${chroot}")
            repo_urls["${chroot}"]="${repo_url}"
          done <<< "${chroot_map}"

          for chroot in ${COPR_CHROOTS}; do
            if [ -z "${repo_urls[${chroot}]:-}" ]; then
              echo "::warning::COPR chroot ${chroot} is not enabled on project ${COPR_PROJECT}; skipping metadata wait"
            fi
          done

          for chroot in "${enabled_chroots[@]}"; do
            url="${repo_urls[${chroot}]%/}/repodata/repomd.xml"
            published=false
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "${url}"; then
                echo "repomd.xml available for ${chroot} (attempt ${attempt}/30)"
                published=true
                break
              fi
              echo "Waiting for ${chroot} repo metadata (attempt ${attempt}/30): ${url}"
              sleep 10
            done
            if [ "${published}" != true ]; then
              echo "::error::COPR repo metadata never appeared for ${chroot}: ${url}"
              exit 1
            fi
          done

      - name: Build source RPM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          topdir="$PWD/rpmbuild"
          mkdir -p "$topdir"/{SOURCES,SPECS,SRPMS} stage

          # Source tarball at the tag, with vendored Go modules so the COPR
          # build does not need network access.
          git archive --format=tar --prefix="bare-eye-${version}/" HEAD | tar -x -C stage
          (cd "stage/bare-eye-${version}" && go mod vendor)
          tar -czf "$topdir/SOURCES/bare-eye-${version}.tar.gz" -C stage "bare-eye-${version}"

          sed "s|^Version:.*|Version:        ${version}|" packaging/bare-eye.spec \
            > "$topdir/SPECS/bare-eye.spec"

          rpmbuild -bs --define "_topdir ${topdir}" "$topdir/SPECS/bare-eye.spec"
          ls -l "$topdir"/SRPMS

      - name: Submit COPR build
        run: |
          set -euo pipefail
          copr-cli build "${COPR_PROJECT}" rpmbuild/SRPMS/*.src.rpm
